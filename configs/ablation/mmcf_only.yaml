# Ablation Study: MMCF Module Only
# We use the full BMDS-Net architecture but disable the Deep Supervision (DDS) loss.
# This isolates the contribution of the Input Fusion module.

data:
  root_dir: "./data/BraTS2021"
  target_size: [128, 128, 128]
  batch_size: 2
  num_workers: 4

model:
  name: "bmds_net"
  img_size: [128, 128, 128]
  in_channels: 4
  out_channels: 4
  feature_size: 48
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  use_checkpoint: True

training:
  epochs: 150
  lr: 2.0e-4
  weight_decay: 1.0e-2
  use_amp: True

loss:
  type: "robust_boundary_dice"
  alpha: 1.0
  beta: 0.5
  # CRITICAL FOR ABLATION: Set auxiliary weights to 0.0 to disable DDS supervision
  dds_weights: [1.0, 0.0, 0.0]

output:
  dir: "./work_dirs/ablation/mmcf_only"
