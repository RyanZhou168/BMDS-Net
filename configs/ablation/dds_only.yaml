# Ablation Study: DDS Module Only
# Focuses on Deep Decoder Supervision impact.

data:
  root_dir: "./data/BraTS2021"
  target_size: [128, 128, 128]
  batch_size: 2

model:
  name: "bmds_net"
  img_size: [128, 128, 128]
  in_channels: 4
  out_channels: 4
  feature_size: 48
  use_checkpoint: True

training:
  epochs: 150
  lr: 2.0e-4
  use_amp: True

loss:
  type: "robust_boundary_dice"
  alpha: 1.0
  beta: 0.5
  # Enable DDS weights fully
  dds_weights: [1.0, 0.4, 0.2]

output:
  dir: "./work_dirs/ablation/dds_only"
