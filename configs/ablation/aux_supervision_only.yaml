# Configuration comparison: auxiliary supervision only.
# BoundaryFocalDice + intermediate decoder heads, without MMCF-derived gating
# in the inference graph.

data:
  root_dir: "./data/BraTS2021"
  target_size: [128, 128, 128]
  batch_size: 2
  num_workers: 4

model:
  name: "bmds_net"
  img_size: [128, 128, 128]
  in_channels: 4
  out_channels: 3
  feature_size: 48
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  use_checkpoint: True
  use_mmcf: False
  use_aux: True
  use_gated_dds: False

training:
  epochs: 150
  lr: 2.0e-4
  weight_decay: 1.0e-4
  use_amp: True

loss:
  type: "boundary_focal_dice"
  dice_weight: 1.0
  boundary_weight: 1.0
  focal_weight: 1.0
  focal_gamma: 2.0
  dds_weights: [1.0, 0.4, 0.2]
  distill_weight: 0.0

output:
  dir: "./work_dirs/configuration/aux_supervision_only"
