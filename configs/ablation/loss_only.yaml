# Configuration comparison: loss only.
# Swin UNETR inference graph trained with BoundaryFocalDice, without auxiliary
# decoder heads, MMCF, gated DDS, or feature consistency.

data:
  root_dir: "./data/BraTS2021"
  target_size: [128, 128, 128]
  batch_size: 2
  num_workers: 4

model:
  name: "swin_unetr"
  img_size: [128, 128, 128]
  in_channels: 4
  out_channels: 3
  feature_size: 48
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  drop_rate: 0.0
  attn_drop_rate: 0.0
  dropout_path_rate: 0.0
  use_checkpoint: True

training:
  epochs: 150
  lr: 2.0e-4
  weight_decay: 1.0e-4
  use_amp: True

loss:
  type: "boundary_focal_dice"

output:
  dir: "./work_dirs/configuration/loss_only"
