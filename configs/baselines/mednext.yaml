# Baseline: MedNeXt (SOTA CNN)
data:
  root_dir: "./data/BraTS2021"
  target_size: [128, 128, 128]
  batch_size: 2

model:
  name: "mednext"
  in_channels: 4
  out_channels: 4
  model_id: "B"    # 'B' for Base, 'S' for Small. Matches paper configuration.
  kernel_size: 3   # Kernel size for the MedNeXt block

training:
  epochs: 150
  lr: 2.0e-4
  use_amp: True

loss:
  type: "dice_ce"

output:
  dir: "./work_dirs/baselines/mednext"
