# Stage 1: Robust Deterministic Training Configuration

data:
  root_dir: "./data/BraTS2021"
  target_size: [128, 128, 128]
  batch_size: 2
  num_workers: 4

model:
  name: "bmds_net"
  img_size: [128, 128, 128]
  in_channels: 4
  out_channels: 4
  feature_size: 48
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  drop_rate: 0.1
  attn_drop_rate: 0.1
  dropout_path_rate: 0.2
  use_checkpoint: True

training:
  epochs: 150
  lr: 2.0e-4
  weight_decay: 1.0e-2
  use_amp: True
  
loss:
  type: "robust_boundary_dice"
  alpha: 1.0  # DiceCE Weight
  beta: 0.5   # Boundary Weight
  dds_weights: [1.0, 0.4, 0.2] # Weights for [Main, Aux1, Aux2]

output:
  dir: "./work_dirs/stage1_deterministic"
